<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="load-status" style="font-size: 16px; font-weight: 600; color: #0affce;">Loading Subway Surfers...</div>
    </div>
    <div id="gameContainer"></div>
    <script>
        function mergeParts(urls) {
            return Promise.all(urls.map(u => fetch(u).then(r => {
                if (!r.ok) throw new Error("Failed to load chunk: " + u);
                return r.arrayBuffer();
            }))).then(buffers => {
                let blob = new Blob(buffers);
                return URL.createObjectURL(blob);
            });
        }

        const statusEl = document.getElementById("load-status");
        statusEl.innerText = "Merging game data...";

        Promise.all([
            mergeParts(["Build/SanFrancisco.data.unityweb.part1", "Build/SanFrancisco.data.unityweb.part2"]),
            mergeParts(["Build/SanFrancisco.wasm.code.unityweb.part1", "Build/SanFrancisco.wasm.code.unityweb.part2"])
        ]).then(([dataUrl, codeUrl]) => {
            statusEl.innerText = "Launching Unity engine...";
            var buildConfig = {
                companyName: "Kiloo Games",
                productName: "Subway Surfers",
                productVersion: "1.94.0",
                dataUrl: dataUrl,
                wasmCodeUrl: codeUrl,
                wasmFrameworkUrl: "Build/SanFrancisco.wasm.framework.unityweb",
                TOTAL_MEMORY: 369098752,
                graphicsAPI: ["WebGL 2.0", "WebGL 1.0"],
                webglContextAttributes: { preserveDrawingBuffer: false },
                splashScreenStyle: "Dark",
                backgroundColor: "#231F20",
                developmentBuild: false,
                multithreading: false,
                unityVersion: "2019.4.18f1"
            };

            let blob = new Blob([JSON.stringify(buildConfig)], { type: 'application/json' });
            let blobUrl = URL.createObjectURL(blob);

            var gameInstance = UnityLoader.instantiate("gameContainer", buildConfig, {
                url: blobUrl,
                onProgress: function(instance, progress) {
                    if (progress < 1) {
                        statusEl.innerText = "Loading assets " + Math.round(progress * 100) + "%...";
                    }
                },
                Module: {
                    onRuntimeInitialized: function() {
                        var ls = document.getElementById("loading-screen");
                        if (ls) ls.style.display = "none";
                    }
                }
            });
        }).catch(err => {
            console.error(err);
            statusEl.innerText = "Error loading Subway Surfers: " + err.message;
        });
    </script>
