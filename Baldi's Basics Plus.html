<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Baldi's%20Basics%20Plus/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Baldi's Basics Plus</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        width: 100%;
        background: #000;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #loading-text {
        color: #fff;
        font-size: 28px;
        font-family: sans-serif;
        text-align: center;
        margin-top: 40px;
        position: relative;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="loading-text">LOADING...</div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>

    <script>
      const loadingText = document.querySelector("#loading-text");
      let totalBytes = 126500000;
      let loadedBytes = 0;

      function formatSize(bytes) {
        if (bytes > 1024 * 1024 * 1024) {
          return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
        } else if (bytes > 1024 * 1024) {
          return (bytes / (1024 * 1024)).toFixed(2) + " MB";
        } else if (bytes > 1024) {
          return (bytes / 1024).toFixed(2) + " KB";
        } else {
          return bytes + " B";
        }
      }

      function getMirrorUrl(url, attempt) {
        if (attempt === 0) return url;
        try {
          const absUrl = new URL(url, document.baseURI).href;
          if (attempt % 2 === 1) {
            return absUrl.replace(/https:\/\/(?:cdn|fastly|gcore)\.jsdelivr\.net\/gh\/([^/@]+)\/([^/@]+)@[^/]+\//, (m, p1, p2) => 'https://raw.githubusercontent.com/' + p1 + '/' + p2 + '/main/');
          }
          return absUrl.replace('https://cdn.jsdelivr.net', 'https://gcore.jsdelivr.net');
        } catch (e) {
          return url;
        }
      }

      async function fetchUrlWithRetry(url, retries = 3, allowNotFound = false) {
        for (let attempt = 0; attempt <= retries; attempt++) {
          const targetUrl = getMirrorUrl(url, attempt);
          try {
            const res = await fetch(targetUrl);
            if (res.ok) return res;
            if (allowNotFound && (res.status === 404 || res.status === 403) && attempt === 0) {
              return res; // file might be chunked (.chunk00/.chunk01)
            }
          } catch (e) {
            if (attempt === retries && !allowNotFound) throw e;
          }
        }
        return fetch(url);
      }

      async function readWithProgress(response) {
        if (!response.ok) {
          throw new Error(`Failed to load ${response.url}: HTTP ${response.status}`);
        }
        const reader = response.body.getReader();
        let chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          loadedBytes += value.length;
          chunks.push(value);
          const doneText = formatSize(loadedBytes);
          const totalText = formatSize(totalBytes);
          const percent = totalBytes > 0 ? Math.min(100, (loadedBytes / totalBytes) * 100).toFixed(1) : "?";
          loadingText.textContent = `LOADING... ${doneText} / ${totalText} (${percent}%)`;
        }
        let fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (let chunk of chunks) {
          fullBuffer.set(chunk, offset);
          offset += chunk.length;
        }
        return fullBuffer.buffer;
      }

      async function fetchWithProgress(url) {
        let response = await fetchUrlWithRetry(url, 3, true);
        if (response.ok) return readWithProgress(response);

        // If file not found directly, fetch .chunk00 and .chunk01
        const buffers = [];
        for (let i = 0; i < 2; i++) {
          const chunkUrl = `${url}.chunk${String(i).padStart(2, "0")}`;
          let chunkRes = await fetchUrlWithRetry(chunkUrl, 3, false);
          if (!chunkRes.ok) {
            throw new Error(`Failed to load ${chunkUrl}: HTTP ${chunkRes.status}`);
          }
          buffers.push(await readWithProgress(chunkRes));
        }

        const totalSize = buffers.reduce((sum, buffer) => sum + buffer.byteLength, 0);
        const merged = new Uint8Array(totalSize);
        let offset = 0;
        for (const buffer of buffers) {
          merged.set(new Uint8Array(buffer), offset);
          offset += buffer.byteLength;
        }
        return merged.buffer;
      }

      async function mergeFiles(parts) {
        const buffers = await Promise.all(parts.map(fetchWithProgress));
        return URL.createObjectURL(new Blob(buffers));
      }

      function getParts(file, count) {
        let parts = [];
        for (let i = 1; i <= count; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }

      (async () => {
        try {
          const dataParts = getParts("Build/BaldiPlusNew.data", 5);
          const wasmParts = getParts("Build/BaldiPlusNew.wasm", 2);
          const [dataUrl, wasmUrl] = await Promise.all([
            mergeFiles(dataParts),
            mergeFiles(wasmParts),
          ]);

          var container = document.querySelector("#unity-container");
          var canvas = document.querySelector("#unity-canvas");
          var loadingBar = document.querySelector("#unity-loading-bar");
          var progressBarFull = document.querySelector("#unity-progress-bar-full");

          function unityShowBanner(msg, type) {}

          var buildUrl = "Build";
          var loaderUrl = buildUrl + "/BaldiPlusNew.loader.js";
          var config = {
            dataUrl: dataUrl,
            frameworkUrl: buildUrl + "/BaldiPlusNew.framework.js",
            codeUrl: wasmUrl,
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Basically Games",
            productName: "Baldi's Basics Plus",
            productVersion: "0.12.2a",
            showBanner: unityShowBanner,
          };

          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement("meta");
            meta.name = "viewport";
            meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
            document.getElementsByTagName("head")[0].appendChild(meta);
          }

          loadingBar.style.display = "block";

          var script = document.createElement("script");
          script.src = loaderUrl;
          script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
              progressBarFull.style.width = 100 * progress + "%";
            })
              .then((unityInstance) => {
                loadingText.remove();
                loadingBar.style.display = "none";
              })
              .catch((message) => {
                console.error("Unity instantiation error:", message);
                alert(message);
              });
          };
          script.onerror = (e) => {
            console.error("Failed to load loaderUrl:", loaderUrl, e);
          };
          document.body.appendChild(script);
        } catch (err) {
          console.error("BaldiPlus loading error:", err);
          loadingText.textContent = "Error loading Baldi's Basics Plus. Please check network.";
        }
      })();
    </script>
  </body>
</html>
