    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }
    </style>

    <script>
        // --- Athyx Sitelock Security Guard ---
        (function() {
            var _k = ["YXRoeXgtbmV0d29yay53ZWIuYXBw", "YXRoeXgtbmV0d29yay5maXJlYmFzZWFwcC5jb20=", "bG9jYWxob3N0", "MTI3LjAuMC4x", "ZGFuaWlsLWF0aHl4LmdpdGh1Yi5pbw=="];
            var _domains = _k.map(function(s) { try { return atob(s).toLowerCase(); } catch(e) { return ""; } });

            function _isAuthorized() {
                var current = (window.location && window.location.hostname) ? window.location.hostname.toLowerCase() : "";
                if (_domains.indexOf(current) !== -1) return true;

                if (window.location.ancestorOrigins && window.location.ancestorOrigins.length > 0) {
                    for (var i = 0; i < window.location.ancestorOrigins.length; i++) {
                        try {
                            var aHost = new URL(window.location.ancestorOrigins[i]).hostname.toLowerCase();
                            if (_domains.indexOf(aHost) !== -1) return true;
                        } catch(e) {}
                    }
                    return false;
                }

                if (document.referrer) {
                    try {
                        var refHost = new URL(document.referrer).hostname.toLowerCase();
                        if (_domains.indexOf(refHost) !== -1) return true;
                    } catch(e) {}
                }

                try {
                    if (window.parent && window.parent.location && window.parent.location.hostname) {
                        if (_domains.indexOf(window.parent.location.hostname.toLowerCase()) !== -1) return true;
                    }
                } catch(e) {}

                return false;
            }

            if (!_isAuthorized()) {
                window.stop && window.stop();
                document.documentElement.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0d0e15;color:#fff;font-family:sans-serif;text-align:center;padding:20px;"><div><h1 style="color:#f43f5e;font-size:32px;margin-bottom:12px;">Access Restricted</h1><p style="color:#94a3b8;font-size:16px;max-width:500px;line-height:1.6;margin:0 auto 24px;">This game is protected and authorized for playback exclusively on <b>Athyx Network</b>.</p><a href="https://athyx-network.web.app/" target="_blank" style="display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;padding:12px 28px;border-radius:8px;font-weight:600;box-shadow:0 4px 14px rgba(59,130,246,0.4);">Play on Athyx Network</a></div></div>';
                throw new Error("Athyx Sitelock: Unauthorized domain");
            }
        })();
    </script>

    <script src="./poki-sdk.js"></script>
</head>
