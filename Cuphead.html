<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cuphead</title>
  <base href="https://cdn.jsdelivr.net/gh/web-ports/cuphead@c9ff1b6b16f9d402b78a42fc2200e1c076c0ab6e/">

  <script>
    // --- Athyx Sitelock Security Guard ---
    (function() {
      var _k = ["YXRoeXgtbmV0d29yay53ZWIuYXBw", "YXRoeXgtbmV0d29yay5maXJlYmFzZWFwcC5jb20=", "bG9jYWxob3N0", "MTI3LjAuMC4x", "ZGFuaWlsLWF0aHl4LmdpdGh1Yi5pbw=="];
      var _domains = _k.map(function(s) { try { return atob(s).toLowerCase(); } catch(e) { return ""; } });

      function _isAuthorized() {
        var current = (window.location && window.location.hostname) ? window.location.hostname.toLowerCase() : "";
        if (_domains.indexOf(current) !== -1) return true;

        if (window.location.ancestorOrigins && window.location.ancestorOrigins.length > 0) {
          for (var i = 0; i < window.location.ancestorOrigins.length; i++) {
            try {
              var aHost = new URL(window.location.ancestorOrigins[i]).hostname.toLowerCase();
              if (_domains.indexOf(aHost) !== -1) return true;
            } catch(e) {}
          }
          return false;
        }

        if (document.referrer) {
          try {
            var refHost = new URL(document.referrer).hostname.toLowerCase();
            if (_domains.indexOf(refHost) !== -1) return true;
          } catch(e) {}
        }

        try {
          if (window.parent && window.parent.location && window.parent.location.hostname) {
            if (_domains.indexOf(window.parent.location.hostname.toLowerCase()) !== -1) return true;
          }
        } catch(e) {}

        if (current === "" || window.location.protocol === "about:" || window.location.protocol === "blob:" || window.location.protocol === "data:") {
          return true;
        }

        return false;
      }

      if (!_isAuthorized()) {
        window.stop && window.stop();
        document.documentElement.innerHTML = '<div style="background:#09090b;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;text-align:center;padding:20px;">' +
          '<h1 style="color:#ef4444;font-size:32px;margin-bottom:12px;">Access Restricted</h1>' +
          '<p style="color:#a1a1aa;max-width:480px;line-height:1.5;">This game is locked to Athyx Network. Please play on the official portal at <a href="https://athyx-network.web.app" style="color:#38bdf8;text-decoration:none;">athyx-network.web.app</a>.</p>' +
          '</div>';
        throw new Error("Athyx Sitelock: Unauthorized domain");
      }
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #0d0c0d;
      color: #fff;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    #gameContainer {
      width: 100vw !important;
      height: 100vh !important;
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1c1817 0%, #0a090a 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }

    .cuphead-logo {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f59e0b;
      text-shadow: 0 4px 16px rgba(245, 158, 11, 0.4), 0 2px 0 #b45309;
      margin-bottom: 20px;
      text-align: center;
    }

    .cuphead-status {
      font-size: 16px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 16px;
      letter-spacing: 1px;
      text-align: center;
      min-height: 24px;
    }

    .progress-bar-container {
      width: min(90vw, 480px);
      height: 16px;
      background: #27272a;
      border-radius: 999px;
      padding: 3px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      border-radius: 999px;
      transition: width 0.15s ease-out;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }

    .cuphead-subtext {
      font-size: 13px;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .cuphead-tip {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
      max-width: 440px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
  <script src="Build/UnityLoader.js"></script>
</head>
<body>
  <div id="loading-overlay">
    <div class="cuphead-logo">CUPHEAD</div>
    <div class="cuphead-status" id="loading-status">INITIALIZING ASSETS...</div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    <div class="cuphead-subtext" id="loading-subtext">Connecting to CDN...</div>
    <div class="cuphead-tip">Assets are cached locally after first load for instant subsequent play.</div>
  </div>

  <div id="gameContainer"></div>

  <script>
    (function() {
      var BASE = "https://cdn.jsdelivr.net/gh/web-ports/cuphead@c9ff1b6b16f9d402b78a42fc2200e1c076c0ab6e/";
      var statusEl = document.getElementById("loading-status");
      var fillEl = document.getElementById("progress-fill");
      var subEl = document.getElementById("loading-subtext");
      var overlayEl = document.getElementById("loading-overlay");

      var totalExpectedBytes = 2203387805; // ~2101.31 MB
      var loadedBytes = 0;
      var dismissed = false;

      function updateProgress(mbDone, mbTotal, pct, statusText) {
        if (fillEl) fillEl.style.width = pct + "%";
        if (statusEl && statusText) statusEl.textContent = statusText;
        if (subEl) subEl.textContent = mbDone + " MB / " + mbTotal + " MB (" + pct + "%)";
      }

      function dismissLoader() {
        if (dismissed) return;
        dismissed = true;
        if (overlayEl) {
          overlayEl.style.transition = "opacity 0.6s ease-out";
          overlayEl.style.opacity = "0";
          setTimeout(function() {
            if (overlayEl.parentNode) overlayEl.parentNode.removeChild(overlayEl);
          }, 600);
        }
      }

      async function fetchWithProgress(url) {
        var response = await fetch(url);
        if (!response.ok) throw new Error("HTTP " + response.status + " for " + url);
        var reader = response.body.getReader();
        var chunks = [];
        var received = 0;
        while (true) {
          var res = await reader.read();
          if (res.done) break;
          var val = res.value;
          received += val.length;
          loadedBytes += val.length;
          chunks.push(val);
          var mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
          var mbTotal = (totalExpectedBytes / (1024 * 1024)).toFixed(2);
          var pct = Math.min(100, Math.round((loadedBytes / totalExpectedBytes) * 100));
          updateProgress(mbDone, mbTotal, pct, "DOWNLOADING GAME ASSETS...");
        }
        var buffer = new Uint8Array(received);
        var offset = 0;
        for (var i = 0; i < chunks.length; i++) {
          buffer.set(chunks[i], offset);
          offset += chunks[i].length;
        }
        return buffer.buffer;
      }

      async function mergeFiles(fileParts, cacheKey) {
        try {
          var cache = await caches.open("cuphead-cache");
          var cachedResponse = await cache.match(cacheKey);
          if (cachedResponse) {
            var blob = await cachedResponse.blob();
            loadedBytes += blob.size;
            var mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
            var mbTotal = (totalExpectedBytes / (1024 * 1024)).toFixed(2);
            var pct = Math.min(100, Math.round((loadedBytes / totalExpectedBytes) * 100));
            updateProgress(mbDone, mbTotal, pct, "LOADING FROM LOCAL CACHE...");
            return URL.createObjectURL(blob);
          }
        } catch (e) {}

        var results = new Array(fileParts.length);
        var nextIdx = 0;
        var concurrency = 6;
        async function worker() {
          while (nextIdx < fileParts.length) {
            var idx = nextIdx++;
            results[idx] = await fetchWithProgress(fileParts[idx]);
          }
        }
        var workers = [];
        for (var w = 0; w < concurrency; w++) workers.push(worker());
        await Promise.all(workers);

        var mergedBlob = new Blob(results);
        try {
          var cache2 = await caches.open("cuphead-cache");
          await cache2.put(cacheKey, new Response(mergedBlob));
        } catch (e) {}
        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        var parts = [];
        for (var i = start; i <= end; i++) {
          parts.push(BASE + file + ".part" + i);
        }
        return parts;
      }

      (async function start() {
        try {
          var urls = await Promise.all([
            mergeFiles(getParts("Build/CupheadPort.data.unityweb", 1, 103), "CupheadPort.data.unityweb"),
            mergeFiles(getParts("Build/CupheadPort.wasm.code.unityweb", 1, 2), "CupheadPort.wasm.code.unityweb"),
            mergeFiles(getParts("Build/CupheadPort.asm.code.unityweb", 1, 3), "CupheadPort.asm.code.unityweb")
          ]);
          var dataUrl = urls[0];
          var wasmUrl = urls[1];
          var asmUrl = urls[2];

          if (statusEl) statusEl.textContent = "PREPARING UNITY ENGINE & SHADERS...";
          if (subEl) subEl.textContent = "Unpacking WebAssembly virtual filesystem...";
          if (fillEl) fillEl.style.width = "99%";

          var originalOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function(method, url) {
            var args = Array.prototype.slice.call(arguments);
            if (typeof args[1] === "string") {
              if (args[1].indexOf("CupheadPort.data.unityweb") !== -1) {
                args[1] = dataUrl;
              } else if (args[1].indexOf("CupheadPort.wasm.code.unityweb") !== -1) {
                args[1] = wasmUrl;
              } else if (args[1].indexOf("CupheadPort.asm.code.unityweb") !== -1) {
                args[1] = asmUrl;
              } else if (args[1].indexOf("CupheadPort.") !== -1 && args[1].indexOf("http") !== 0 && args[1].indexOf("blob:") !== 0) {
                args[1] = BASE + "Build/" + args[1].split("/").pop();
              }
            }
            if (args.length === 2) {
              return originalOpen.call(this, args[0], args[1]);
            }
            return originalOpen.apply(this, args);
          };

          var gameInstance = UnityLoader.instantiate("gameContainer", BASE + "Build/CupheadPort.json", {
            onProgress: function(instance, progress) {
              if (progress >= 1) {
                dismissLoader();
              } else if (progress > 0) {
                var pct = Math.round(progress * 100);
                if (statusEl) statusEl.textContent = "INITIALIZING CUPHEAD... (" + pct + "%)";
                if (fillEl) fillEl.style.width = pct + "%";
              }
            },
            Module: {
              TOTAL_MEMORY: 1073741824, // 1 GB memory pool
              graphicsAPI: ["WebGL 2.0", "WebGL 1.0"],
              onRuntimeInitialized: function() {
                dismissLoader();
              },
              postRun: [
                function() {
                  dismissLoader();
                }
              ]
            }
          });

          // Fallback timer: if Unity finishes without triggering callbacks, dismiss after reasonable grace
          setTimeout(function() {
            var canvas = document.querySelector("#gameContainer canvas");
            if (canvas && canvas.width > 0 && canvas.height > 0) {
              dismissLoader();
            }
          }, 8000);

        } catch (err) {
          console.error("Cuphead loader failure:", err);
          if (statusEl) statusEl.innerHTML = '<span style="color:#ef4444;">Error loading Cuphead</span>';
          if (subEl) subEl.textContent = err.message || "Failed to load game assets. Check your network connection.";
        }
      })();
    })();
  </script>
</body>
</html>
