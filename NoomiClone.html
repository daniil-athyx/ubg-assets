<body>

            var _domains = _k.map(function(s) { try { return atob(s).toLowerCase(); } catch(e) { return ""; } });

            function _isAuthorized() {
                var current = (window.location && window.location.hostname) ? window.location.hostname.toLowerCase() : "";
                if (_domains.indexOf(current) !== -1) return true;

                if (window.location.ancestorOrigins && window.location.ancestorOrigins.length > 0) {
                    for (var i = 0; i < window.location.ancestorOrigins.length; i++) {
                        try {
                            var aHost = new URL(window.location.ancestorOrigins[i]).hostname.toLowerCase();
                            if (_domains.indexOf(aHost) !== -1) return true;
                        } catch(e) {}
                    }
                    return false;
                }

                if (document.referrer) {
                    try {
                        var refHost = new URL(document.referrer).hostname.toLowerCase();
                        if (_domains.indexOf(refHost) !== -1) return true;
                    } catch(e) {}
                }

                try {
                    if (window.top && window.top.location && window.top.location.hostname) {
                        var topHost = window.top.location.hostname.toLowerCase();
                        if (_domains.indexOf(topHost) !== -1) return true;
                    }
                } catch(e) {}

                return false;
            }

            if (!_isAuthorized()) {
                window.stop && window.stop();
                var lockStyle = "position:fixed;inset:0;background:#06060c;color:#ff3b5c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Segoe UI,sans-serif;z-index:99999999;text-align:center;padding:24px;";
                var html = '<div style="' + lockStyle + '">' +
                    '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom:16px;">' +
                    '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>' +
                    '<h1 style="font-size:22px;margin:0 0 8px;font-weight:700;letter-spacing:0.5px;">SECURITY LOCK &bull; UNAUTHORIZED HOST</h1>' +
                    '<p style="color:#a1a1aa;max-width:440px;font-size:14px;line-height:1.6;margin:0 0 20px;">' +
                    'Noomi Clone is protected software exclusively authorized to run on <strong>Athyx Network</strong>. Embedding or copying to unauthorized domains is prohibited.' +
                    '</p>' +

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/V1.7.5.loader.js";
        var config = {
            dataUrl: buildUrl + "/V1.7.5.data",
            frameworkUrl: buildUrl + "/V1.7.5.framework.js",
            codeUrl: buildUrl + "/V1.7.5.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "NoomiClone Dev",
            productName: "NoomiClone",
            productVersion: "1.7.5",
            showBanner: unityShowBanner,
            matchWebGLToCanvasSize: true
        };

        loadingBar.style.display = "block";

        async function initWasm() {
            try {
                const res1 = await fetch(buildUrl + "/V1.7.5.wasm.part1");
                if (res1.ok) {
                    const res2 = await fetch(buildUrl + "/V1.7.5.wasm.part2");
                    if (res2.ok) {
                        const b1 = await res1.blob();
                        const b2 = await res2.blob();
                        const combined = new Blob([b1, b2], { type: "application/wasm" });
                        config.codeUrl = URL.createObjectURL(combined);
                    }
                }
            } catch (e) {
                console.warn("Using default wasm url:", e);
            }
        }

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = async () => {
            await initWasm();
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
                window.unityInstance = unityInstance;
                window.focus();
            }).catch((message) => {
                alert(message);
            });
        };

        document.body.appendChild(script);
    </script>
