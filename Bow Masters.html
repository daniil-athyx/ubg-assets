<!DOCTYPE html>


<!-- Ultimate Game Stash file-->
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->


<!DOCTYPE html>
<html>

<head>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/bowmasters/">
  <title>Bowmasters</title>

  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-touch-fullscreen" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="msapplication-tap-highlight" content="no" />
  <meta name="MobileOptimized" content="960" />
  <meta name="viewport"
    content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, initial-scale=1.0, user-scalable=no, minimal-ui" />
  <meta charset="utf-8" />

  <link rel="stylesheet" type="text/css" href="style/index.css" nonce="nDK4DWRLJoqf7mjw9cLs1g" />

  <script>
    if (typeof window.ytgame === "undefined") {
      window.ytgame = {
        SDK_VERSION: "1.0.0",
        IN_PLAYABLES_ENV: false,
        game: {
          firstFrameReady: function () {
            var el = document.getElementById("athyx-loading");
            if (el) el.style.display = "none";
          },
          gameReady: function () {
            var el = document.getElementById("athyx-loading");
            if (el) el.style.display = "none";
          },
          saveData: function (data) {
            try { localStorage.setItem("bowmasters_save", data); } catch (e) { }
            return Promise.resolve();
          },
          loadData: function () {
            try { return Promise.resolve(localStorage.getItem("bowmasters_save") || ""); } catch (e) { return Promise.resolve(""); }
          }
        },
        engagement: {
          sendScore: function () { return Promise.resolve(); }
        },
        system: {
          isAudioEnabled: function () { return true; },
          onAudioEnabledChange: function () { return function () { }; },
          onPause: function () { return function () { }; },
          onResume: function () { return function () { }; }
        }
      };
    }
  </script>
  <script src="customytgame.js" nonce="nDK4DWRLJoqf7mjw9cLs1g"></script>
  <script src="game.js" nonce="nDK4DWRLJoqf7mjw9cLs1g"></script>
  <script nonce="nDK4DWRLJoqf7mjw9cLs1g">
    window.addEventListener("load", () => {
      if (typeof window.runGame === "function") window.runGame();
      setTimeout(function () {
        var el = document.getElementById("athyx-loading");
        if (el) el.style.display = "none";
      }, 6000);
    });
  </script>
</head>


<body>
  <div id="athyx-loading"
    style="position:fixed;inset:0;background:#0d0e15;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:sans-serif;">
    <div
      style="width:44px;height:44px;border:4px solid rgba(255,255,255,0.2);border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px;">
    </div>
    <div style="font-size:18px;font-weight:600;letter-spacing:0.5px;">LOADING BOWMASTERS...</div>
    <style>
      @keyframes spin {
        to {
          transform: rotate(360deg)
        }
      }
    </style>
  </div>
  <div id="game"></div>
</body>

</html>
