<!DOCTYPE html>
<html lang="en-us">
<head>
	<base href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/noomiclone-beta/">
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
	<title>NoomiClone Beta</title>
	<link rel="shortcut icon" href="TemplateData/favicon.ico">
	<link rel="stylesheet" href="TemplateData/style.css">
	<style>
		*::-webkit-scrollbar, html::-webkit-scrollbar, body::-webkit-scrollbar {
			display: none !important;
			width: 0 !important;
			height: 0 !important;
		}
		html, body {
			margin: 0 !important;
			padding: 0 !important;
			width: 100vw !important;
			height: 100vh !important;
			overflow: hidden !important;
			background: #231F20 !important;
			scrollbar-width: none !important;
			-ms-overflow-style: none !important;
		}
		.webgl-content {
			position: absolute !important;
			top: 0 !important;
			left: 0 !important;
			width: 100vw !important;
			height: 100vh !important;
			transform: none !important;
			margin: 0 !important;
			padding: 0 !important;
		}
		#unityContainer {
			width: 100vw !important;
			height: 100vh !important;
		}
	</style>
	<script>
		function UnityProgress(unityInstance, progress) {
			if (!unityInstance.Module) return;
			if (!unityInstance.logo) {
				unityInstance.logo = document.createElement("div");
				unityInstance.logo.className = "logo " + (unityInstance.Module.splashScreenStyle || "Dark");
				unityInstance.container.appendChild(unityInstance.logo);
			}
			if (!unityInstance.progress) {    
				unityInstance.progress = document.createElement("div");
				unityInstance.progress.className = "progress " + (unityInstance.Module.splashScreenStyle || "Dark");
				unityInstance.progress.empty = document.createElement("div");
				unityInstance.progress.empty.className = "empty";
				unityInstance.progress.appendChild(unityInstance.progress.empty);
				unityInstance.progress.full = document.createElement("div");
				unityInstance.progress.full.className = "full";
				unityInstance.progress.appendChild(unityInstance.progress.full);
				unityInstance.container.appendChild(unityInstance.progress);
			}
			unityInstance.progress.full.style.width = (100 * progress) + "%";
			unityInstance.progress.empty.style.width = (100 * (1 - progress)) + "%";
			if (progress >= 1) {
				if (unityInstance.logo) unityInstance.logo.style.display = "none";
				if (unityInstance.progress) unityInstance.progress.style.display = "none";
			}
		}
	</script>
	<script src="Build/UnityLoader.js"></script>
	<script>
		function initGame() {
			if (typeof UnityLoader !== "undefined" && typeof UnityLoader.instantiate === "function") {
				window.unityInstance = UnityLoader.instantiate("unityContainer", "Build/webgl-4.json", {
					onProgress: typeof UnityProgress === "function" ? UnityProgress : function() {}
				});
			} else {
				setTimeout(initGame, 50);
			}
		}
		if (document.readyState === "loading") {
			document.addEventListener("DOMContentLoaded", initGame);
		} else {
			initGame();
		}
	</script>
</head>
<body>
	<div class="webgl-content">
		<div id="unityContainer"></div>
	</div>
</body>
</html>
