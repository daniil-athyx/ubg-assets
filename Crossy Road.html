<!DOCTYPE html>


<!-- Ultimate Game Stash file--> 
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->


<html lang="en">
<head>
  <base href="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@latest/crossy-road/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Crossy Road</title>

  <!-- YouTube Playables SDK shim -->
  <script>
    window.ytgame = {
      SDK_VERSION: "1.0.0",
      IN_PLAYABLES_ENV: false,
      game: {
        firstFrameReady: function() {},
        gameReady: function() {},
        saveData: function(data) {
          try { localStorage.setItem("crossy_road_save", data); } catch(e) {}
          return Promise.resolve();
        },
        loadData: function() {
          try { return Promise.resolve(localStorage.getItem("crossy_road_save") || ""); } catch(e) { return Promise.resolve(""); }
        }
      },
      engagement: {
        sendScore: function() { return Promise.resolve(); }
      },
      system: {
        isAudioEnabled: function() { return true; },
        onAudioEnabledChange: function() { return function() {}; },
        onPause: function() { return function() {}; },
        onResume: function() { return function() {}; }
      }
    };
  </script>

  <!-- Load game's CSS file. -->
  <link rel="stylesheet" href="style.css" nonce="2KHli9LrFFijH2jCb5SkMw">

   <!-- Core libraries like Three.js -->
  <script src="scripts/three.min.js" nonce="2KHli9LrFFijH2jCb5SkMw"></script>

  <!-- Main game script -->
  <script src="scripts/game.min.js" nonce="2KHli9LrFFijH2jCb5SkMw"></script>

  <!-- Additional scripts -->
  <script src="scripts/extra.min.js" nonce="2KHli9LrFFijH2jCb5SkMw"></script>
  <script src="scripts/bootstrap.min.js" nonce="2KHli9LrFFijH2jCb5SkMw"></script>
</head>

<body>
  <canvas id="canvas"></canvas>
  <div id="build-number"></div>  <!-- delete this when not in testing -->

  
</body>
</html>
