<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/games/Slender/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Slender: The Eight Pages</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
        * { margin: 0; padding: 0; border: 0; overflow: hidden; }
        body {
            background: #000;
            position: fixed;
            width: 100vw;
            height: 100vh;
        }
        .webgl-content, #unityContainer {
            position: fixed !important;
            width: 100vw !important;
            height: 100vh !important;
            top: 0 !important;
            left: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            transform: none !important;
        }
        canvas, #unityContainer canvas {
            width: 100vw !important;
            height: 100vh !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            display: block !important;
        }
        .footer {
            display: none !important;
        }
        #loading-text {
            color: #f43f5e;
            font-size: 32px;
            font-family: monospace;
            text-align: center;
            position: absolute;
            top: 45%;
            width: 100%;
            letter-spacing: 2px;
        }
    </style>

    <script>
        // --- Athyx Sitelock Security Guard ---
        (function() {
            var _k = ["YXRoeXgtbmV0d29yay53ZWIuYXBw", "YXRoeXgtbmV0d29yay5maXJlYmFzZWFwcC5jb20=", "bG9jYWxob3N0", "MTI3LjAuMC4x", "ZGFuaWlsLWF0aHl4LmdpdGh1Yi5pbw=="];
            var _domains = _k.map(function(s) { try { return atob(s).toLowerCase(); } catch(e) { return ""; } });

            function _isAuthorized() {
                var current = (window.location && window.location.hostname) ? window.location.hostname.toLowerCase() : "";
                if (_domains.indexOf(current) !== -1) return true;

                if (window.location.ancestorOrigins && window.location.ancestorOrigins.length > 0) {
                    for (var i = 0; i < window.location.ancestorOrigins.length; i++) {
                        try {
                            var aHost = new URL(window.location.ancestorOrigins[i]).hostname.toLowerCase();
                            if (_domains.indexOf(aHost) !== -1) return true;
                        } catch(e) {}
                    }
                    return false;
                }

                if (document.referrer) {
                    try {
                        var refHost = new URL(document.referrer).hostname.toLowerCase();
                        if (_domains.indexOf(refHost) !== -1) return true;
                    } catch(e) {}
                }

                try {
                    if (window.parent && window.parent.location && window.parent.location.hostname) {
                        if (_domains.indexOf(window.parent.location.hostname.toLowerCase()) !== -1) return true;
                    }
                } catch(e) {}

                return false;
            }

            if (!_isAuthorized()) {
                window.stop && window.stop();
                document.documentElement.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0d0e15;color:#fff;font-family:sans-serif;text-align:center;padding:20px;"><div><h1 style="color:#f43f5e;font-size:32px;margin-bottom:12px;">Access Restricted</h1><p style="color:#94a3b8;font-size:16px;max-width:500px;line-height:1.6;margin:0 auto 24px;">This game is protected and authorized for playback exclusively on <b>Athyx Network</b>.</p><a href="https://athyx-network.web.app/" target="_blank" style="display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;padding:12px 28px;border-radius:8px;font-weight:600;box-shadow:0 4px 14px rgba(59,130,246,0.4);">Play on Athyx Network</a></div></div>';
                throw new Error("Athyx Sitelock: Unauthorized domain");
            }
        })();
    </script>

    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers);
                        resolve(URL.createObjectURL(mergedBlob));
                        return;
                    }
                    fetch(fileParts[index]).then(r => r.arrayBuffer()).then(data => {
                        buffers.push(data);
                        fetchPart(index + 1);
                    }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        Promise.all([
            mergeFiles(getParts("Build/Build.data.unityweb", 1, 2))
        ]).then(([dataUrl]) => {
            var json = {
                "companyName": "Parsec Productions",
                "productName": "Slender",
                "dataUrl": dataUrl,
                "asmCodeUrl": "Build.asm.code.unityweb",
                "asmMemoryUrl": "Build.asm.memory.unityweb",
                "asmFrameworkUrl": "Build.asm.framework.unityweb",
                "TOTAL_MEMORY": 268435456,
                "graphicsAPI": ["WebGL 2.0", "WebGL 1.0"],
                "webglContextAttributes": {"preserveDrawingBuffer": false},
                "splashScreenStyle": "Dark",
                "backgroundColor": "#000000"
            };
            let blob = new Blob([JSON.stringify(json)], { type: 'application/json' });
            let blobUrl = URL.createObjectURL(blob);
            UnityLoader.instantiate("unityContainer", json, {
                onProgress: UnityProgress,
                url: blobUrl,
                Module: {
                    onRuntimeInitialized: function () {
                        var lt = document.querySelector("#loading-text");
                        if (lt) lt.remove();
                    }
                }
            });
        });
    </script>
</head>
<body>
    <div class="webgl-content">
        <div id="loading-text">COLLECTING PAGES...</div>
        <div id="unityContainer"></div>
    </div>
</body>
</html>
