<!DOCTYPE html>
<html lang="en-us">

<head>
    <base href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Baldi's%20Basics%20Remastered/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Baldi's Basics Classic Remastered</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            border: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #231F20;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #loading-text {
            color: white;
            font-size: 28px;
            font-family: sans-serif;
            text-align: center;
            margin-top: 40px;
            position: relative;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="loading-text">LOADING...</div>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/WebGL.loader.js"></script>
    <script>
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
        }

        const loadingText = document.querySelector("#loading-text");
        const totalBytes = 111383205;
        let loadedBytes = 0;

        function formatSize(bytes) {
            if (bytes > 1024 * 1024 * 1024) {
                return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
            } else if (bytes > 1024 * 1024) {
                return (bytes / (1024 * 1024)).toFixed(2) + " MB";
            } else if (bytes > 1024) {
                return (bytes / 1024).toFixed(2) + " KB";
            } else {
                return bytes + " B";
            }
        }

        function getMirrorUrl(url, attempt) {
            if (attempt === 0) return url;
            try {
                const absUrl = new URL(url, document.baseURI).href;
                if (attempt % 2 === 1) {
                    return absUrl.replace(
                        /https:\/\/(?:cdn|fastly|gcore)\.jsdelivr\.net\/gh\/([^/@]+)\/([^/@]+)@[^/]+\//,
                        (m, p1, p2) => 'https://raw.githubusercontent.com/' + p1 + '/' + p2 + '/main/'
                    );
                }
                return absUrl.replace('https://cdn.jsdelivr.net', 'https://gcore.jsdelivr.net');
            } catch (e) {
                return url;
            }
        }

        async function fetchUrlWithRetry(url, retries = 3) {
            for (let attempt = 0; attempt <= retries; attempt++) {
                const targetUrl = getMirrorUrl(url, attempt);
                try {
                    const res = await fetch(targetUrl);
                    if (res.ok) return res;
                    console.warn(`Fetch returned ${res.status} for ${targetUrl}, trying next mirror...`);
                } catch (e) {
                    console.warn(`Fetch error for ${targetUrl}:`, e);
                }
            }
            throw new Error(`Failed to load ${url} from all mirrors.`);
        }

        async function readWithProgress(response) {
            if (!response.ok) {
                throw new Error(`Failed to load ${response.url}: HTTP ${response.status}`);
            }
            const reader = response.body.getReader();
            let chunks = [];
            let received = 0;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                received += value.length;
                loadedBytes += value.length;
                chunks.push(value);
                const doneText = formatSize(loadedBytes);
                const totalText = formatSize(totalBytes);
                const percent = totalBytes > 0 ? Math.min(100, (loadedBytes / totalBytes) * 100).toFixed(1) : "?";
                loadingText.textContent = `LOADING... ${doneText} / ${totalText} (${percent}%)`;
            }
            let fullBuffer = new Uint8Array(received);
            let offset = 0;
            for (let chunk of chunks) {
                fullBuffer.set(chunk, offset);
                offset += chunk.length;
            }
            return fullBuffer.buffer;
        }

        async function fetchPart(url) {
            const response = await fetchUrlWithRetry(url);
            return readWithProgress(response);
        }

        async function mapConcurrent(items, limit, fn) {
            const results = new Array(items.length);
            let index = 0;
            async function worker() {
                while (index < items.length) {
                    const i = index++;
                    results[i] = await fn(items[i], i);
                }
            }
            const workers = Array.from({ length: Math.min(limit, items.length) }, () => worker());
            await Promise.all(workers);
            return results;
        }

        async function assembleBlobUrl(partList) {
            const buffers = await mapConcurrent(partList, 3, fetchPart);
            const totalSize = buffers.reduce((sum, b) => sum + b.byteLength, 0);
            const merged = new Uint8Array(totalSize);
            let offset = 0;
            for (const buf of buffers) {
                merged.set(new Uint8Array(buf), offset);
                offset += buf.byteLength;
            }
            return URL.createObjectURL(new Blob([merged]));
        }

        (async () => {
            try {
                const dataFiles = [
                    "Build/WebGL.data.part1.chunk00",
                    "Build/WebGL.data.part1.chunk01",
                    "Build/WebGL.data.part2.chunk00",
                    "Build/WebGL.data.part2.chunk01",
                    "Build/WebGL.data.part3"
                ];

                const wasmFiles = [
                    "Build/WebGL.wasm.part1.chunk00",
                    "Build/WebGL.wasm.part1.chunk01",
                    "Build/WebGL.wasm.part2.chunk00",
                    "Build/WebGL.wasm.part2.chunk01",
                    "Build/WebGL.wasm.part3"
                ];

                const [dataUrl, wasmUrl] = await Promise.all([
                    assembleBlobUrl(dataFiles),
                    assembleBlobUrl(wasmFiles)
                ]);

                createUnityInstance(document.querySelector("#unity-canvas"), {
                    dataUrl: dataUrl,
                    frameworkUrl: "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Baldi's%20Basics%20Remastered/Build/WebGL.framework.js",
                    codeUrl: wasmUrl,
                    streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Baldi's%20Basics%20Remastered/StreamingAssets",
                    companyName: "Basically Games",
                    productName: "Baldi's Basics Classic Remastered",
                    productVersion: "1.1",
                }).then(() => {
                    loadingText.remove();
                }).catch((err) => {
                    console.error("Unity instantiation error:", err);
                    alert("Unity error: " + err);
                });
            } catch (err) {
                console.error("Baldi Remastered loading error:", err);
                loadingText.textContent = "Error loading Baldi's Basics Classic Remastered. Please check network.";
            }
        })();
    </script>
</body>

</html>
