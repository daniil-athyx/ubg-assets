<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Vex%207/">
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui, shrink-to-fit=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Vex 7</title>
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Vex%207/assets/icon.png" />
    <link rel="apple-touch-icon" type="image/png" href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Vex%207/assets/icon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Vex%207/assets/css/app.css" type="text/css" />
  </head>
  <body>
    <div id="content"></div>
    <div id="loader">Loading...</div>
    <div id="orientation"></div>
    <script id="gamedistribution-jssdk"></script>
    <script type="text/javascript">
      window.version = "fix-this";
      window.libs = [];
      window.gdsdk = {
        showAd: function() { return Promise.resolve(); },
        showBanner: function() { return Promise.resolve(); },
        preloadAd: function() { return Promise.resolve(); },
        init: function() { return Promise.resolve(); },
        sendEvent: function() {},
        getSession: function() { return {}; }
      };
      window.GD_OPTIONS = {
        gameId: "0c454c9562d249d28ba3a2b50564042c",
        advertisementSettings: { autoplay: false },
        onEvent: function() {}
      };
      var _azerionIntegration = {
        rtgEnabled: false,
        lbEnabled: false,
        fbType: "dummy",
        alxType: "std",
        af: false,
        sa: false,
        la: false,
        bd: 0,
        playBtn: true,
        cp: false,
      };

      var enableAnalytics, azAdWrapper, _azFeedback;

      window.addEventListener("load", function () {
        var s = document.createElement("script");
        s.src = "vex7.min.js";
        s.onload = function () {
          var loader = document.getElementById("loader");
          if (loader) loader.style.display = "none";
        };
        s.onerror = function () {
          var retry = document.createElement("script");
          retry.src = "https://raw.githubusercontent.com/daniil-athyx/athyx-game-lib/main/Vex%207/vex7.min.js";
          retry.onload = function () {
            var loader = document.getElementById("loader");
            if (loader) loader.style.display = "none";
          };
          document.body.appendChild(retry);
        };
        document.body.appendChild(s);
      });
    </script>
  </body>
</html>
