<!doctype html>
<html>

<head>

    <script>
        // --- Athyx Sitelock Security Guard ---
        (function() {
            var _k = ["YXRoeXgtbmV0d29yay53ZWIuYXBw", "YXRoeXgtbmV0d29yay5maXJlYmFzZWFwcC5jb20=", "bG9jYWxob3N0", "MTI3LjAuMC4x", "ZGFuaWlsLWF0aHl4LmdpdGh1Yi5pbw=="];
            var _domains = _k.map(function(s) { try { return atob(s).toLowerCase(); } catch(e) { return ""; } });

            function _isAuthorized() {
                var current = (window.location && window.location.hostname) ? window.location.hostname.toLowerCase() : "";
                if (_domains.indexOf(current) !== -1) return true;

                if (window.location.ancestorOrigins && window.location.ancestorOrigins.length > 0) {
                    for (var i = 0; i < window.location.ancestorOrigins.length; i++) {
                        try {
                            var aHost = new URL(window.location.ancestorOrigins[i]).hostname.toLowerCase();
                            if (_domains.indexOf(aHost) !== -1) return true;
                        } catch(e) {}
                    }
                    return false;
                }

                if (document.referrer) {
                    try {
                        var refHost = new URL(document.referrer).hostname.toLowerCase();
                        if (_domains.indexOf(refHost) !== -1) return true;
                    } catch(e) {}
                }

                try {
                    if (window.parent && window.parent.location && window.parent.location.hostname) {
                        if (_domains.indexOf(window.parent.location.hostname.toLowerCase()) !== -1) return true;
                    }
                } catch(e) {}

                if (current === "" || window.location.protocol === "about:" || window.location.protocol === "blob:" || window.location.protocol === "data:") {
                    return true;
                }

                return false;
            }

            if (!_isAuthorized()) {
                window.stop && window.stop();
                document.documentElement.innerHTML = '<div style="background:#09090b;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;text-align:center;padding:20px;">' +
                    '<h1 style="color:#ef4444;font-size:32px;margin-bottom:12px;">Access Restricted</h1>' +
                    '<p style="color:#a1a1aa;max-width:480px;line-height:1.5;">This game is locked to Athyx Network. Please play on the official portal at <a href="https://athyx-network.web.app" style="color:#38bdf8;text-decoration:none;">athyx-network.web.app</a>.</p>' +
                    '</div>';
                throw new Error("Athyx Sitelock: Unauthorized domain");
            }
        })();
    </script>

<meta charset="utf-8">
<title>re3 web port</title>
<style>
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #000;
	}
	#canvas {
		display: block;
		width: 100vw;
		height: 100vh;
		outline: none;
		touch-action: none;
	}
	#crashOverlay {
		display: none;
		position: fixed;
		inset: 0;
		z-index: 1000;
		background: rgba(20, 0, 0, 0.95);
		color: #ff6b6b;
		font-family: "Consolas", "Menlo", monospace;
		padding: 24px;
		box-sizing: border-box;
		overflow: auto;
	}
	#crashOverlay h1 {
		color: #ff3b3b;
		font-size: 20px;
		margin: 0 0 8px 0;
	}
	#crashOverlay p {
		color: #ddd;
		margin: 0 0 16px 0;
		font-size: 13px;
	}
	#crashOverlay pre {
		white-space: pre-wrap;
		word-break: break-word;
		font-size: 12px;
		line-height: 1.4;
		color: #eee;
		background: rgba(255, 255, 255, 0.05);
		padding: 12px;
		border-radius: 4px;
	}
	#loadingOverlay {
		position: fixed;
		inset: 0;
		z-index: 900;
		background: #000;
		color: #ccc;
		font-family: "Consolas", "Menlo", monospace;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 16px;
		text-align: center;
		padding: 24px;
		box-sizing: border-box;
	}
	#loadingOverlay .spinner {
		width: 40px;
		height: 40px;
		border-radius: 50%;
		border: 4px solid #333;
		border-top-color: #6bb0ff;
		animation: loadingSpin 0.8s linear infinite;
	}
	@keyframes loadingSpin { to { transform: rotate(360deg); } }
	#loadingStatus {
		font-size: 14px;
		color: #eee;
		max-width: 90vw;
		word-break: break-word;
	}
	#loadingHint {
		font-size: 12px;
		color: #888;
	}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="loadingOverlay">
	<div class="spinner"></div>
	<div id="loadingStatus">Starting up...</div>
	<div id="loadingHint">First load can take a few minutes (~860MB of game assets) - this is not frozen, keep this tab open.</div>
</div>
<div id="crashOverlay">
	<h1 id="crashTitle">The game has crashed</h1>
	<p>Please screenshot or copy this and report it. Reload the page to try again.</p>
	<pre id="crashDetail"></pre>
</div>
<script>
	// Distinguishes "still loading" from "crashed" - without this, a slow ~860MB asset
	// preload and a silent crash looked identical to the user. Shown by default, hidden only
	// once the game reaches "Initialise: end" (see updateLoadingStatus below and Game.cpp's
	// STEP macro). The crash overlay (above) takes over on top of this if something goes wrong
	// mid-load instead of this ever silently disappearing.
	function updateLoadingStatus(s) {
		var el = document.getElementById('loadingStatus');
		if (el) el.textContent = s;
		if (s === 'Initialise: end') {
			var overlay = document.getElementById('loadingOverlay');
			if (overlay) overlay.style.display = 'none';
		}
	}
</script>
<script>
	// Keep a rolling buffer of engine log lines so a crash report can show recent context
	// leading up to it, without a permanently-visible on-page console (that's what devtools
	// is for during dev - beta testers need a crash report, not a live log firehose).
	var recentLog = [];
	function pushLog(s) {
		recentLog.push(s);
		if (recentLog.length > 300)
			recentLog.shift();
	}

	var crashShown = false;
	function showCrash(title, detail) {
		if (crashShown) return;
		crashShown = true;
		document.getElementById('crashTitle').textContent = title;
		document.getElementById('crashDetail').textContent =
			detail + '\n\n--- recent log ---\n' + recentLog.join('\n');
		document.getElementById('crashOverlay').style.display = 'block';
	}

	var Module = {
		canvas: document.getElementById('canvas'),
		print: function (s) { pushLog(s); console.log(s); },
		printErr: function (s) { pushLog(s); console.error(s); },
		onAbort: function (what) { showCrash('Emscripten abort', String(what)); },
		// Called by the generated re3.js loader itself during the re3.data download/decompress
		// phase (before any of our own C++ STEP() checkpoints can run) - this is the biggest
		// chunk of the "5 minutes with nothing on screen" complaint, so surface it too.
		setStatus: function (s) { if (s) updateLoadingStatus(s); },
		// Save games live under /userfiles in Emscripten's in-memory filesystem, which is
		// wiped on every reload unless backed by something real - mount IDBFS there and
		// pull down whatever was persisted last time before main() runs. C++ persists new
		// writes back out via FS.syncfs(false, ...) after a save completes (see PCSave.cpp).
		preRun: [function () {
			FS.mkdir('/userfiles');
			FS.mount(IDBFS, {}, '/userfiles');
			Module.addRunDependency('idbfs-load');
			FS.syncfs(true, function (err) {
				if (err) console.error('Failed to load save data from IndexedDB:', err);
				Module.removeRunDependency('idbfs-load');
			});
		}],
	};

	window.onerror = function (msg, source, lineno, colno, error) {
		showCrash('Uncaught error', msg + '\n  at ' + source + ':' + lineno + ':' + colno +
			(error && error.stack ? '\n' + error.stack : ''));
	};
	window.addEventListener('unhandledrejection', function (e) {
		var r = e.reason;
		var msg = (r && (r.name || '') + ' ' + (r.message || '')) || String(r);
		if (/pointer\s?lock/i.test(msg)) {
			// SDL_SetRelativeMouseMode() -> requestPointerLock() rejects while the page has no
			// user gesture yet (the game enables the mouse cursor during init). Not a crash -
			// SDL re-requests once the player actually clicks. Swallow so the crash overlay
			// doesn't false-positive on the first load.
			e.preventDefault();
			console.warn('Suppressed pointer-lock rejection:', msg);
			return;
		}
		showCrash('Unhandled promise rejection', r && r.stack ? r.stack : msg);
	});
</script>
<script src="re3.js"></script>
</body>
</html>
