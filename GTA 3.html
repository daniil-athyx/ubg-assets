    <script>
        // --- Athyx Sitelock Security Guard ---
        (function() {
            var _k = ["YXRoeXgtbmV0d29yay53ZWIuYXBw", "YXRoeXgtbmV0d29yay5maXJlYmFzZWFwcC5jb20=", "bG9jYWxob3N0", "MTI3LjAuMC4x", "ZGFuaWlsLWF0aHl4LmdpdGh1Yi5pbw=="];
            var _domains = _k.map(function(s) { try { return atob(s).toLowerCase(); } catch(e) { return ""; } });

            function _isAuthorized() {
                var current = (window.location && window.location.hostname) ? window.location.hostname.toLowerCase() : "";
                if (_domains.indexOf(current) !== -1) return true;

                if (window.location.ancestorOrigins && window.location.ancestorOrigins.length > 0) {
                    for (var i = 0; i < window.location.ancestorOrigins.length; i++) {
                        try {
                            var aHost = new URL(window.location.ancestorOrigins[i]).hostname.toLowerCase();
                            if (_domains.indexOf(aHost) !== -1) return true;
                        } catch(e) {}
                    }
                    return false;
                }

                if (document.referrer) {
                    try {
                        var refHost = new URL(document.referrer).hostname.toLowerCase();
                        if (_domains.indexOf(refHost) !== -1) return true;
                    } catch(e) {}
                }

                try {
                    if (window.parent && window.parent.location && window.parent.location.hostname) {
                        if (_domains.indexOf(window.parent.location.hostname.toLowerCase()) !== -1) return true;
                    }
                } catch(e) {}

                if (current === "" || window.location.protocol === "about:" || window.location.protocol === "blob:" || window.location.protocol === "data:") {
                    return true;
                }

                return false;
            }

            if (!_isAuthorized()) {
                window.stop && window.stop();
                document.documentElement.innerHTML = '<div style="background:#09090b;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;text-align:center;padding:20px;">' +
                    '<h1 style="color:#ef4444;font-size:32px;margin-bottom:12px;">Access Restricted</h1>' +
                    '<p style="color:#a1a1aa;max-width:480px;line-height:1.5;">This game is locked to Athyx Network. Please play on the official portal at <a href="https://athyx-network.web.app" style="color:#38bdf8;text-decoration:none;">athyx-network.web.app</a>.</p>' +
                    '</div>';
                throw new Error("Athyx Sitelock: Unauthorized domain");
            }
        })();

        // --- GTA 3 Asset Redirect Guard ---
        (function() {
            var _origFetch = window.fetch;
            var RAW_ROOT = "https://raw.githubusercontent.com/woahhcrackers/GTA3Web/main/";
            window.fetch = function(resource, init) {
                var url = (resource instanceof Request) ? resource.url : String(resource);

                // Any asset request for GTA3Web (audio/, re3.data.*, models/, txd/, lazy_manifest.json, re3.wasm)
                // Routed directly to raw.githubusercontent.com to avoid jsDelivr 20MB limit and 503/CORS errors
                if (url.indexOf("woahhcrackers/GTA3Web") !== -1 ||
                    url.indexOf("re3.data.") !== -1 ||
                    url.indexOf("audio/") !== -1 ||
                    url.indexOf("models/") !== -1 ||
                    url.indexOf("txd/") !== -1 ||
                    url.indexOf("lazy_manifest.json") !== -1 ||
                    url.indexOf("re3.wasm") !== -1) {

                    var target = url;
                    if (target.indexOf("cdn.jsdelivr.net/gh/woahhcrackers/GTA3Web") !== -1) {
                        target = target.replace(/https:\/\/cdn\.jsdelivr\.net\/gh\/woahhcrackers\/GTA3Web@[^/]+\//, RAW_ROOT);
                    } else if (target.indexOf("http://") !== 0 && target.indexOf("https://") !== 0) {
                        target = RAW_ROOT + target.replace(/^\.?\//, "");
                    }

                    if (resource instanceof Request) {
                        return _origFetch(new Request(target, resource), init);
                    }
                    return _origFetch(target, init);
                }

                return _origFetch(resource, init);
            };
        })();
    </script>

<meta charset="utf-8">
<title>re3 web port</title>
<style>
	html, body {

		padding: 0;

	#crashOverlay {

	}

<body>
<canvas id="canvas"></canvas>
<div id="loadingOverlay">
	<div class="loader-logo">GTA III</div>
	<div class="spinner"></div>
	<div id="loadingStatus">Starting up...</div>
	<div class="progress-container">
		<div class="progress-bar-bg">
			<div class="progress-bar-fill" id="progressBarFill"></div>
		</div>
		<div class="progress-info">
			<span id="progressPercent">0%</span>
			<span id="progressBytes">0 MB / ~95 MB</span>
		</div>
	</div>
	<div id="loadingHint">Streaming game assets directly — please keep this tab open.</div>
</div>
<div id="crashOverlay">
	<h1 id="crashTitle">The game has crashed</h1>
	<p>Please screenshot or copy this and report it. Reload the page to try again.</p>
	<pre id="crashDetail"></pre>
</div>
<script>
	// Distinguishes "still loading" from "crashed"
	var barFill = document.getElementById('progressBarFill');
	var pctText = document.getElementById('progressPercent');
	var bytesText = document.getElementById('progressBytes');
	var statusEl = document.getElementById('loadingStatus');

	var overlayHidden = false;
	function hideOverlay() {
		if (overlayHidden) return;
		overlayHidden = true;
		var overlay = document.getElementById('loadingOverlay');
		if (overlay) {
			overlay.style.transition = 'opacity 0.4s ease-out';
			overlay.style.opacity = '0';
			setTimeout(function() { overlay.style.display = 'none'; }, 400);
		}
	}

	document.getElementById('loadingOverlay')?.addEventListener('click', function() {
		if (barFill && (barFill.style.width === '100%' || parseInt(barFill.style.width) >= 90)) {
			hideOverlay();
		}
	});

	function updateLoadingStatus(s) {
		if (statusEl) statusEl.textContent = s;
		if (s) {
			var match = s.match(/\((\d+)\/(\d+)\)/);
			if (match && barFill) {
				var loaded = parseInt(match[1], 10);
				var total = parseInt(match[2], 10);
				if (total > 0) {
					var pct = Math.min(100, Math.round((loaded / total) * 100));
					barFill.style.width = pct + '%';
					if (pctText) pctText.textContent = pct + '%';
					if (bytesText) {
						bytesText.textContent = (loaded / 1048576).toFixed(1) + ' MB / ' + (total / 1048576).toFixed(1) + ' MB';
					}
					if (pct >= 100) {
						setTimeout(hideOverlay, 1500);
					}
				}
			} else if (s.indexOf('Running') !== -1 || s.indexOf('Initialise') !== -1) {
				if (barFill) barFill.style.width = '100%';
				if (pctText) pctText.textContent = '100%';
				if (bytesText) bytesText.textContent = 'Starting engine...';
				setTimeout(hideOverlay, 1200);
			}
		} else if (s === '') {
			setTimeout(hideOverlay, 1000);
		}

		if (s === 'Initialise: end') {
			hideOverlay();
		}
	}
</script>
<script>
	// Keep a rolling buffer of engine log lines so a crash report can show recent context
	// leading up to it, without a permanently-visible on-page console (that's what devtools
	// is for during dev - beta testers need a crash report, not a live log firehose).
	var recentLog = [];
	function pushLog(s) {
		recentLog.push(s);
		if (recentLog.length > 300)
			recentLog.shift();
	}

	var crashShown = false;
	function showCrash(title, detail) {
		if (crashShown) return;
		crashShown = true;
		document.getElementById('crashTitle').textContent = title;
		document.getElementById('crashDetail').textContent =
			detail + '\n\n--- recent log ---\n' + recentLog.join('\n');
		document.getElementById('crashOverlay').style.display = 'block';
	}

	var Module = {
		canvas: document.getElementById('canvas'),
		print: function (s) {
			pushLog(s);
			console.log(s);
			if (s && (s.indexOf('OpenGL') !== -1 || s.indexOf('cdvd_stream') !== -1 || s.indexOf('Initialise') !== -1 || s.indexOf('Audio') !== -1)) {
				setTimeout(hideOverlay, 1000);
			}
		},
		printErr: function (s) { pushLog(s); console.error(s); },
		onAbort: function (what) { showCrash('Emscripten abort', String(what)); },
		setStatus: function (s) { updateLoadingStatus(s); },
		onRuntimeInitialized: function() {
			setTimeout(hideOverlay, 2000);
		},
		postRun: [function () {
			setTimeout(hideOverlay, 1500);
		}],
		preRun: [function () {
			FS.mkdir('/userfiles');
			FS.mount(IDBFS, {}, '/userfiles');
			Module.addRunDependency('idbfs-load');
			FS.syncfs(true, function (err) {
				if (err) console.error('Failed to load save data from IndexedDB:', err);
				Module.removeRunDependency('idbfs-load');
			});
		}],
	};

	window.onerror = function (msg, source, lineno, colno, error) {
		showCrash('Uncaught error', msg + '\n  at ' + source + ':' + lineno + ':' + colno +
			(error && error.stack ? '\n' + error.stack : ''));
	};
	window.addEventListener('unhandledrejection', function (e) {
		var r = e.reason;
		var msg = (r && (r.name || '') + ' ' + (r.message || '')) || String(r);
		if (/pointer\s?lock/i.test(msg)) {
			// SDL_SetRelativeMouseMode() -> requestPointerLock() rejects while the page has no
			// user gesture yet (the game enables the mouse cursor during init). Not a crash -
			// SDL re-requests once the player actually clicks. Swallow so the crash overlay
			// doesn't false-positive on the first load.
			e.preventDefault();
			console.warn('Suppressed pointer-lock rejection:', msg);
			return;
		}
		showCrash('Unhandled promise rejection', r && r.stack ? r.stack : msg);
	});
</script>
<script src="re3.js"></script>
</body>
