<!DOCTYPE html>
<html lang="en">
<head>
    <base href="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/8-ball-classic/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>8 Ball Pool</title>
    <style>
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000000;
        }
        #mygame {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script>
        // Clean YouTube Playables SDK mock (avoids external infected ytgame.js)
        window.ytgame = {
            game: {
                firstFrameReady: function() {},
                gameReady: function() {},
                loadProgress: function() {},
                saveData: function() { return Promise.resolve(); },
                loadData: function() { return Promise.resolve(null); }
            },
            engagement: {
                sendScore: function() { return Promise.resolve(); }
            },
            system: {
                isAudioEnabled: function() { return true; },
                onAudioEnabledChange: function() {}
            }
        };
        window.YOUTUBE = {
            sendScore: function() { return Promise.resolve(); },
            saveData: function() { return Promise.resolve(); },
            loadData: function() { return Promise.resolve(null); }
        };

        window.famobi_gameID = "8-ball-billiards-classic";
        window.famobi_gameJS = [
            "assets/src/01phaser.js",
            "assets/src/02Ball.js",
            "assets/src/03contactListener.js",
            "assets/src/04billiardPhysics.js",
            "assets/src/05levelData.js",
            "assets/src/06maths.js",
            "assets/src/07vector2d.js",
            "assets/src/08render.js",
            "assets/src/09sound.js",
            "assets/src/10effects.js",
            "assets/src/11timer.js",
            "assets/src/12load.js",
            "assets/src/13mainMenu.js",
            "assets/src/14setup.js",
            "assets/src/15gameController.js",
            "assets/src/16boot.js",
            function() {}
        ];
        (function(document, url, fgJS, firstJS) {
            fgJS = document.createElement('script');
            firstJS = document.getElementsByTagName('script')[0];
            fgJS.src = url + "";
            firstJS.parentNode.insertBefore(fgJS, firstJS);
        })(document, 'html5games/gameapi/v1.js');
    </script>
</head>
<body>
    <center><div id="mygame"></div></center>
</body>
</html>
