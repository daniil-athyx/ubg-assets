<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Baldis-Fun-New-School/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Baldi's Fun New School Plus Ultimate Edition</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        width: 100%;
        background: #000;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #loading-text {
        color: white;
        font-size: 28px;
        font-family: sans-serif;
        text-align: center;
        margin-top: 40px;
        position: relative;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="loading-text">LOADING...</div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Baldi's Fun New School Plus Ultimate Edition</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var loadingText = document.querySelector("#loading-text");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Baldis-Fun-New-School/Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.loader.js";

      const totalBytes = 189000000;
      let loadedBytes = 0;

      function formatSize(bytes) {
        if (bytes > 1024 * 1024 * 1024) return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
        if (bytes > 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + " MB";
        if (bytes > 1024) return (bytes / 1024).toFixed(2) + " KB";
        return bytes + " B";
      }

      function getMirrorUrl(url, attempt) {
        const clean = encodeURI(decodeURI(url));
        if (attempt === 0) {
          try { return new URL(clean, document.baseURI).href; } catch(e) { return clean; }
        }
        try {
          const absUrl = new URL(clean, document.baseURI).href;
          if (attempt % 2 === 1) {
            return absUrl.replace(
              /https:\/\/(?:cdn|fastly|gcore)\.jsdelivr\.net\/gh\/([^/@]+)\/([^/@]+)@[^/]+\//,
              (m, p1, p2) => 'https://raw.githubusercontent.com/' + p1 + '/' + p2 + '/main/'
            );
          }
          return absUrl.replace('https://cdn.jsdelivr.net', 'https://gcore.jsdelivr.net');
        } catch (e) {
          return clean;
        }
      }

      async function fetchUrlWithRetry(url, retries = 3) {
        for (let attempt = 0; attempt <= retries; attempt++) {
          const targetUrl = getMirrorUrl(url, attempt);
          try {
            const res = await fetch(targetUrl);
            if (res.ok) return res;
            console.warn(`Fetch returned ${res.status} for ${targetUrl}, trying next mirror...`);
          } catch (e) {
            console.warn(`Fetch error for ${targetUrl}:`, e);
          }
        }
        throw new Error(`Failed to load ${url} from all mirrors.`);
      }

      async function readWithProgress(response) {
        if (!response.ok) {
          throw new Error(`Failed to load ${response.url}: HTTP ${response.status}`);
        }
        const reader = response.body.getReader();
        let chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          loadedBytes += value.length;
          chunks.push(value);
          const doneText = formatSize(loadedBytes);
          const totalText = formatSize(totalBytes);
          const percent = totalBytes > 0 ? Math.min(100, (loadedBytes / totalBytes) * 100).toFixed(1) : "?";
          if (loadingText) loadingText.textContent = `LOADING... ${doneText} / ${totalText} (${percent}%)`;
        }
        let fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (let chunk of chunks) {
          fullBuffer.set(chunk, offset);
          offset += chunk.length;
        }
        return fullBuffer.buffer;
      }

      async function fetchPart(url) {
        const response = await fetchUrlWithRetry(url);
        return readWithProgress(response);
      }

      async function mapConcurrent(items, limit, fn) {
        const results = new Array(items.length);
        let index = 0;
        async function worker() {
          while (index < items.length) {
            const i = index++;
            results[i] = await fn(items[i], i);
          }
        }
        const workers = Array.from({ length: Math.min(limit, items.length) }, () => worker());
        await Promise.all(workers);
        return results;
      }

      async function assembleBlobUrl(partList) {
        const buffers = await mapConcurrent(partList, 3, fetchPart);
        const totalSize = buffers.reduce((sum, b) => sum + b.byteLength, 0);
        const merged = new Uint8Array(totalSize);
        let offset = 0;
        for (const buf of buffers) {
          merged.set(new Uint8Array(buf), offset);
          offset += buf.byteLength;
        }
        return URL.createObjectURL(new Blob([merged]));
      }

      (async () => {
        try {
          const dataFiles = [
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part1.chunk00",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part1.chunk01",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part2.chunk00",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part2.chunk01",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part3.chunk00",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part3.chunk01",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part4.chunk00",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part4.chunk01",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part5.chunk00",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part5.chunk01",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part6.chunk00",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part6.chunk01",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part7.chunk00",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part7.chunk01",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part8.chunk00",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part8.chunk01",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.data.part9"
          ];

          const wasmFiles = [
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.wasm.part1.chunk00",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.wasm.part1.chunk01",
            "Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.wasm.part2"
          ];

          const [dataUrl, wasmUrl] = await Promise.all([
            assembleBlobUrl(dataFiles),
            assembleBlobUrl(wasmFiles)
          ]);

          var config = {
            dataUrl: dataUrl,
            frameworkUrl: "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Baldis-Fun-New-School/Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.framework.js",
            codeUrl: wasmUrl,
            streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Baldis-Fun-New-School/StreamingAssets",
            companyName: "JohnsterSpaceGames",
            productName: "Baldi's Fun New School Plus Ultimate Edition",
            productVersion: "0.2.5b",
            showBanner: unityShowBanner,
          };

          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            config.devicePixelRatio = 1;
            unityShowBanner('WebGL builds are not supported on mobile devices.');
          } else {
            canvas.style.width = "960px";
            canvas.style.height = "600px";
          }
          canvas.style.background = "url('https://cdn.jsdelivr.net/gh/daniil-athyx/athyx-game-lib@main/Baldis-Fun-New-School/Build/BFNSPUE%20Alpha%206%20Part%202b%20WebGL.jpg') center / cover";
          loadingBar.style.display = "block";

          var script = document.createElement("script");
          script.src = loaderUrl;
          script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
              progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
              if (loadingText) loadingText.remove();
              loadingBar.style.display = "none";
              fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1);
              };
            }).catch((message) => {
              alert(message);
            });
          };
          document.body.appendChild(script);
        } catch (err) {
          console.error("BFNSPUE loading error:", err);
          if (loadingText) loadingText.textContent = "Error loading Baldi's Fun New School. Please check network.";
        }
      })();
    </script>
  </body>
</html>
